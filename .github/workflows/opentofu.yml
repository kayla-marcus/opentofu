name: OpenTofu

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Job-level permissions replace the workflow-level ones, so contents is repeated.
    permissions:
      contents: read
      pull-requests: write
    services:
      localstack:
        image: localstack/localstack:4.4.0
        ports:
          - 4566:4566
    steps:
      - uses: actions/checkout@v4

      - uses: opentofu/setup-opentofu@v2

      # Service containers start without waiting for the app inside to be ready.
      - name: Wait for LocalStack
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:4566/_localstack/health && exit 0
            sleep 2
          done
          echo "LocalStack did not become ready"
          exit 1

      - run: tofu fmt -check
      - run: tofu init -input=false
      - run: tofu validate

      # Explicit shell enables pipefail, so a failed plan still fails the step.
      - name: Plan
        shell: bash
        run: tofu plan -input=false -no-color 2>&1 | tee plan.txt

      # Runs even if the plan failed, so reviewers see the error too.
      - name: Comment plan on PR
        if: always() && hashFiles('plan.txt') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "### OpenTofu plan"
            echo
            echo '```'
            head -c 60000 plan.txt
            echo '```'
          } > comment.md
          gh pr comment "$PR_NUMBER" --body-file comment.md

  apply:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    services:
      localstack:
        image: localstack/localstack:4.4.0
        ports:
          - 4566:4566
    steps:
      - uses: actions/checkout@v4

      - uses: opentofu/setup-opentofu@v2

      - name: Wait for LocalStack
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:4566/_localstack/health && exit 0
            sleep 2
          done
          echo "LocalStack did not become ready"
          exit 1

      - run: tofu init -input=false
      - run: tofu apply -input=false -auto-approve
