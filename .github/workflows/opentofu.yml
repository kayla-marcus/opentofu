name: OpenTofu

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    services:
      localstack:
        image: localstack/localstack
        ports:
          - 4566:4566
    steps:
      - uses: actions/checkout@v4

      - uses: opentofu/setup-opentofu@v2

      # Service containers start without waiting for the app inside to be ready.
      - name: Wait for LocalStack
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:4566/_localstack/health && exit 0
            sleep 2
          done
          echo "LocalStack did not become ready"
          exit 1

      - run: tofu fmt -check
      - run: tofu init -input=false
      - run: tofu validate
      - run: tofu plan -input=false

  apply:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    services:
      localstack:
        image: localstack/localstack
        ports:
          - 4566:4566
    steps:
      - uses: actions/checkout@v4

      - uses: opentofu/setup-opentofu@v2

      - name: Wait for LocalStack
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:4566/_localstack/health && exit 0
            sleep 2
          done
          echo "LocalStack did not become ready"
          exit 1

      - run: tofu init -input=false
      - run: tofu apply -input=false -auto-approve
